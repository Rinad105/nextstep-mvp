<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — NextStep</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body class="auth-body"><div class="ambient ambient-one"></div><main class="auth-shell"><a class="brand auth-brand" href="/"><img class="brand-logo" src="/logo.png" alt="NextStep logo"><span class="brand-word">NextStep</span></a><section class="auth-card"><div class="eyebrow">YOUR NEXT CHAPTER</div><h1>Create your account</h1><p class="auth-subtitle">A world of opportunities is one step away.</p><form id="signupForm"><label>Full name<input name="name" required minlength="2" maxlength="80" autocomplete="name" placeholder="Your name"></label><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>I’m joining as<select name="role" required><option value="learner">Learner — discover opportunities</option><option value="organization">Organization — publish opportunities</option><option value="academy">Academy — publish courses and workshops</option></select></label><fieldset><legend>What are you interested in? <span>(optional)</span></legend><div class="interest-options"><label><input type="checkbox" name="interests" value="Technology"> Technology</label><label><input type="checkbox" name="interests" value="Business"> Business</label><label><input type="checkbox" name="interests" value="Entrepreneurship"> Entrepreneurship</label><label><input type="checkbox" name="interests" value="Design"> Design</label><label><input type="checkbox" name="interests" value="Science"> Science</label><label><input type="checkbox" name="interests" value="Community"> Community</label></div></fieldset><p class="form-error" id="signupError"></p><button class="button button-full" type="submit">Create account <span>↗</span></button></form><p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p><p class="auth-back"><a href="/">← Back to NextStep</a></p></section><p class="auth-foot">Discover. Develop. Do more.</p></main><div class="toast" id="toast" role="status"></div></body></html>
